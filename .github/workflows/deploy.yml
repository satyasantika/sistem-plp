name: Deploy plp
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: deploy-plp
      cancel-in-progress: false
    steps:
      # Gagal di sini belum memerahkan job; percobaan kedua di bawah yang menentukan.
      # Penyebab umum: "dial tcp :22: i/o timeout" dari runner ke server (server sehat).
      # deploy.sh idempoten; flock mencegah dua rilis berbarengan karena skrip generik tanpa kunci.
      - name: Deploy ke server via SSH
        id: rilis
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            flock -w 900 /tmp/deploy-plp.lock ~/docker-apps/deploy.sh plp

      # Beri waktu pulih bila kegagalan berasal dari gangguan sesaat (jaringan atau GitHub).
      - name: Jeda sebelum percobaan 2
        if: steps.rilis.outcome == 'failure'
        run: sleep 60

      - name: Deploy ke server via SSH (percobaan 2)
        if: steps.rilis.outcome == 'failure'
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            flock -w 900 /tmp/deploy-plp.lock ~/docker-apps/deploy.sh plp
